<div class="form-field image-upload" data-image-upload>
  <label for="{{ input_id }}" class="image-upload-label">
    {{ field_label }}
    {% if field_required %}<span class="image-upload-required" aria-hidden="true">*</span>{% endif %}
    {% if field_badge %}<span class="image-upload-badge">{{ field_badge }}</span>{% endif %}
  </label>

  <div class="mt-1.5">
    <input
      id="{{ input_id }}"
      name="{{ input_name }}"
      type="file"
      accept="{{ input_accept|default:'image/*' }}"
      {% if input_capture %}capture="{{ input_capture }}"{% endif %}
      class="image-upload-input"
      data-preview-target="{{ preview_target }}"
      {% if field_required %}aria-required="true"{% endif %}
      {% if help_id %}aria-describedby="{{ help_id }}"{% endif %}
      {% if errors %}aria-invalid="true"{% endif %}
    >

    <label class="image-upload-dropzone" for="{{ input_id }}">
      <span class="image-upload-icon" aria-hidden="true">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16.5V19a2 2 0 002 2h12a2 2 0 002-2v-2.5"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 3v12"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7.5 7.5L12 3l4.5 4.5"/>
        </svg>
      </span>
      <span class="image-upload-copy">
        <span class="image-upload-title">{{ upload_title|default:"Choose an image" }}</span>
        <span class="image-upload-hint">{{ upload_hint|default:"JPG or PNG. Select a file or drag and drop." }}</span>
      </span>
      <span class="image-upload-browse" aria-hidden="true">Browse</span>
    </label>

    <p class="image-upload-filename hidden" data-upload-filename>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12.75l2.25 2.25L15 9.75"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 21a9 9 0 100-18 9 9 0 000 18z"/>
      </svg>
      <span data-upload-filename-text></span>
    </p>
  </div>

  {% if help_text %}
  <p id="{{ help_id }}" class="form-help mt-1.5">{{ help_text }}</p>
  {% endif %}

  {% if required_message %}
  <p id="upload-error-{{ input_name }}" class="form-error mt-1.5 hidden" data-upload-required-error role="alert">
    {{ required_message }}
  </p>
  {% endif %}

  {% if errors %}
  <div id="{{ error_id }}" class="form-error mt-1.5" role="alert">
    {% for err in errors %}<p>{{ err }}</p>{% endfor %}
  </div>
  {% endif %}

  <div
    id="{{ preview_container_id }}"
    class="image-preview{% if not preview_url %} hidden{% endif %}"
    data-preview-container
  >
    <div class="image-preview-header">
      <p class="image-preview-title">{{ preview_title|default:"Image Preview" }}</p>
      <button type="button" class="image-preview-remove" data-preview-remove>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        Remove
      </button>
    </div>
    <div class="image-preview-body">
      <img
        id="{{ preview_image_id }}"
        class="image-preview-image"
        {% if preview_url %}src="{{ preview_url }}"{% endif %}
        alt="{{ preview_alt|default:'Selected image preview' }}"
      >
    </div>
  </div>
</div>
