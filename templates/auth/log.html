{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="AgriScan+: smart farming platform for rice disease detection, yield prediction, and farm records."
  />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />

  <title>{% block title %}AgriScan+{% endblock %}</title>

  <link rel="icon" type="image/jpeg" href="{% static 'polls/img/logo.jpg' %}" />

  <!-- Font: same single family as base.html. System stack is the fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  />

  <link rel="stylesheet" href="{% static 'polls/css/tailwind.css' %}" />

  <style>
    /* =========================================================
       AgriScan+ AUTH LAYOUT
       Tokens below mirror base.html :root so the sign-in pages
       look like the rest of the product. Child templates
       (login, register, other auth pages) use the classes here:
       .auth-input, .auth-button, .auth-alert, .password-toggle
       and the au-* layout classes.
       ========================================================= */
    :root {
      /* Brand (10%) */
      --color-brand: hsl(142, 72%, 29%);
      --color-brand-hover: hsl(142, 64%, 24%);
      --color-brand-active: hsl(144, 61%, 20%);
      --color-brand-light: hsl(138, 76%, 97%);
      --color-brand-border: hsl(142, 77%, 73%);

      /* Surfaces (60% canvas, 30% secondary) */
      --color-canvas: hsl(40, 20%, 98%);
      --color-surface: hsl(0, 0%, 100%);
      --color-overlay: hsl(220, 14%, 96%);

      /* Text */
      --color-text-primary: hsl(220, 15%, 12%);
      --color-text: hsl(220, 14%, 20%);
      --color-text-secondary: hsl(220, 10%, 40%);
      --color-text-muted: hsl(220, 8%, 52%);

      /* Borders */
      --color-border: hsl(220, 13%, 86%);
      --color-border-strong: hsl(220, 13%, 72%);

      /* Semantic */
      --color-success-text: #166534;
      --color-success-soft: #f0fdf4;
      --color-success-border: #86efac;
      --color-warning-text: #92400e;
      --color-warning-soft: #fffbeb;
      --color-warning-border: #fcd34d;
      --color-danger: #dc2626;
      --color-danger-text: #991b1b;
      --color-danger-soft: #fef2f2;
      --color-danger-border: #fca5a5;
      --color-info-text: #075985;
      --color-info-soft: #f0f9ff;
      --color-info-border: #7dd3fc;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.07), 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.09), 0 4px 8px rgba(0, 0, 0, 0.05);

      /* Radius */
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-full: 9999px;

      /* Motion */
      --transition-fast: 100ms ease;
      --transition-base: 180ms ease;
      --transition-slow: 320ms ease;

      /* Type scale */
      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 15px;
      --text-md: 17px;
      --text-lg: 20px;
      --text-xl: 24px;
      --text-hero: clamp(28px, 5vw, 48px);
      --text-page: clamp(20px, 3vw, 30px);

      /* Responsive control sizing (mobile-first) */
      --field-h: 2.75rem;
      --field-fs: 1rem;
      --btn-h: 2.75rem;
      --header-h: 4rem;

      /* Legacy aliases kept for templates that still use --agri-* */
      --agri-primary: var(--color-brand);
      --agri-primary-hover: var(--color-brand-hover);
      --agri-primary-active: var(--color-brand-active);
      --agri-text: var(--color-text);
      --agri-text-muted: var(--color-text-secondary);
      --agri-border: var(--color-border);
      --agri-input-border: var(--color-border-strong);
      --agri-focus: rgba(21, 128, 61, 0.28);
      --agri-shadow: var(--shadow-xs);
      --agri-transition: var(--transition-base);
    }

    @media (min-width: 640px) {
      :root { --field-h: 2.625rem; --field-fs: 0.9375rem; --header-h: 4.25rem; }
    }
    @media (min-width: 1024px) {
      :root { --field-h: 2.5rem; --field-fs: 0.875rem; --btn-h: 2.5rem; }
    }
    /* Touch devices always get 44px targets */
    @media (hover: none) and (pointer: coarse) {
      :root { --field-h: 2.75rem; --field-fs: 1rem; --btn-h: 2.75rem; }
    }

    /* =========================================================
       Foundation
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      max-width: 100%;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background: var(--color-canvas);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0;
      overflow-x: hidden;
      overflow-x: clip;
      background: var(--color-canvas);
      color: var(--color-text);
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: var(--text-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img, svg { max-width: 100%; }
    img { height: auto; }
    button, input, select, textarea { font: inherit; }
    a, button, input, select, textarea { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    :where(h1, h2, h3, h4) {
      margin-top: 0;
      color: var(--color-text-primary);
      font-weight: 650;
      letter-spacing: -0.015em;
    }
    :where(p) { margin-top: 0; }
    :where(a) { color: inherit; text-underline-offset: 2px; }

    a, button, [role="button"] {
      transition:
        color var(--transition-base),
        background-color var(--transition-base),
        border-color var(--transition-base),
        box-shadow var(--transition-base),
        transform var(--transition-base),
        opacity var(--transition-base);
    }

    :where(input, textarea, select, button, a, [tabindex]):focus-visible {
      outline: 2px solid var(--color-brand);
      outline-offset: 2px;
    }

    .skip-link {
      position: fixed;
      top: 0.5rem;
      left: 0.5rem;
      z-index: 200;
      padding: 0.625rem 1rem;
      color: #ffffff;
      background: var(--color-brand);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      font-weight: 600;
      text-decoration: none;
      transform: translateY(-200%);
    }
    .skip-link:focus { transform: translateY(0); }

    /* =========================================================
       Form controls (same values as base.html form foundation)
       ========================================================= */
    .auth-input,
    :where(input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="submit"]):not([type="button"]), textarea, select) {
      display: block;
      width: 100%;
      max-width: 100%;
      min-height: var(--field-h);
      padding: 0.625rem 0.75rem;
      color: var(--color-text);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      font-size: var(--field-fs);
      line-height: 1.5;
      transition:
        border-color var(--transition-base),
        box-shadow var(--transition-base),
        background-color var(--transition-base);
    }
    .auth-input::placeholder { color: var(--color-text-muted); opacity: 1; }
    .auth-input:hover:not(:disabled) { border-color: hsl(220, 10%, 58%); }
    .auth-input:focus {
      outline: none;
      border-color: var(--color-brand);
      box-shadow: 0 0 0 3px var(--agri-focus);
    }
    .auth-input:disabled {
      cursor: not-allowed;
      color: var(--color-text-muted);
      background-color: var(--color-overlay);
    }
    .auth-input[aria-invalid="true"] { border-color: var(--color-danger); }
    .auth-input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.14); }
    /* Room for the show/hide button */
    .auth-input.pr-12 { padding-right: 3rem; }

    :where(input[type="checkbox"], input[type="radio"]) {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--color-brand);
    }

    :where(label) {
      color: var(--color-text-primary);
      font-size: 0.875rem;
      font-weight: 600;
    }

    /* =========================================================
       Buttons (match base .btn-primary)
       ========================================================= */
    .auth-button {
      display: inline-flex;
      width: 100%;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6875rem 1.25rem;
      color: #ffffff;
      background-color: var(--color-brand);
      border: 1px solid var(--color-brand);
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.25rem;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: none;
      transition:
        background-color var(--transition-fast),
        border-color var(--transition-fast),
        box-shadow var(--transition-fast),
        transform var(--transition-fast);
    }
    .auth-button:hover {
      background-color: var(--color-brand-hover);
      border-color: var(--color-brand-hover);
      box-shadow: var(--shadow-xs);
    }
    .auth-button:active {
      background-color: var(--color-brand-active);
      border-color: var(--color-brand-active);
      transform: scale(0.985);
    }
    @media (hover: hover) {
      .auth-button:hover { transform: scale(1.01); }
      .auth-button:active { transform: scale(0.985); }
    }
    .auth-button:disabled,
    .auth-button[aria-disabled="true"] {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    /* Inline loading indicator (set by the submit script below) */
    .auth-button.is-loading::before {
      content: "";
      width: 1rem;
      height: 1rem;
      flex: none;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #ffffff;
      border-radius: var(--radius-full);
      animation: au-spin 700ms linear infinite;
    }
    @keyframes au-spin { to { transform: rotate(360deg); } }

    /* =========================================================
       Alerts (borders visibly darker than the fill)
       ========================================================= */
    .auth-alert {
      display: block;
      padding: 0.75rem 0.875rem;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .auth-alert--error   { color: var(--color-danger-text);  background: var(--color-danger-soft);  border-color: var(--color-danger-border); }
    .auth-alert--info    { color: var(--color-info-text);    background: var(--color-info-soft);    border-color: var(--color-info-border); }
    .auth-alert--success { color: var(--color-success-text); background: var(--color-success-soft); border-color: var(--color-success-border); }
    .auth-alert--warning { color: var(--color-warning-text); background: var(--color-warning-soft); border-color: var(--color-warning-border); }

    /* =========================================================
       Password visibility button
       ========================================================= */
    .password-toggle {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      width: 2.75rem;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--color-text-muted);
      background: transparent;
      border: 0;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      cursor: pointer;
    }
    .password-toggle:hover { color: var(--color-brand); }
    .password-toggle:focus-visible { outline-offset: -2px; }
    .password-toggle svg { width: 1.25rem; height: 1.25rem; pointer-events: none; }

    /* =========================================================
       Header and footer
       ========================================================= */
    .auth-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-xs);
    }
    @supports (backdrop-filter: blur(1px)) {
      .auth-header {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: saturate(1.4) blur(8px);
        -webkit-backdrop-filter: saturate(1.4) blur(8px);
      }
    }
    .au-header-inner {
      display: flex;
      width: 100%;
      max-width: 1600px;
      min-height: var(--header-h);
      align-items: center;
      margin-inline: auto;
      padding-inline: 0.75rem;
    }
    @media (min-width: 640px)  { .au-header-inner { padding-inline: 1rem; } }
    @media (min-width: 1024px) { .au-header-inner { padding-inline: 2rem; } }
    @media (min-width: 1280px) { .au-header-inner { padding-inline: 3rem; } }

    .auth-brand {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      gap: 0.5rem;
      padding: 0 0.25rem;
      color: var(--color-brand);
      border-radius: var(--radius-md);
      font-size: var(--text-md);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .auth-brand:hover { color: var(--color-brand-hover); }
    .auth-brand-logo {
      width: 2.25rem;
      height: 2.25rem;
      flex: none;
      border-radius: var(--radius-md);
      object-fit: cover;
      box-shadow: 0 0 0 1px var(--color-border);
    }

    .auth-footer {
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
    }
    .au-footer-inner {
      display: flex;
      width: 100%;
      max-width: 1600px;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-inline: auto;
      padding: 1.25rem 1rem;
      text-align: center;
    }
    @media (min-width: 640px) {
      .au-footer-inner { flex-direction: row; padding-inline: 1.5rem; text-align: left; }
    }
    @media (min-width: 1024px)  { .au-footer-inner { padding: 0.75rem 2rem; } }
    @media (min-width: 1280px)  { .au-footer-inner { padding-inline: 3rem; } }
    .auth-footer-text {
      margin: 0;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      line-height: 1.4;
    }
    .auth-footer-text strong { color: var(--color-text); font-weight: 600; }

    /* =========================================================
       Page shell
       Mobile: one column, form first. 1024px+: form left,
       product showcase right.
       ========================================================= */
    .au-main { display: flex; min-width: 0; flex-direction: column; flex: 1 1 auto; }

    .au-shell {
      position: relative;
      isolation: isolate;
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      overflow: hidden;
    }
    /* One brand tint, very subtle (60-30-10) */
    .au-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse at 0% 0%, var(--color-brand-light) 0%, transparent 55%);
      pointer-events: none;
    }

    .au-grid {
      display: grid;
      width: 100%;
      max-width: 1600px;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 2.5rem;
      margin-inline: auto;
      padding: 1.5rem 1rem 2rem;
    }
    @media (min-width: 640px) {
      .au-grid { gap: 3rem; padding: 2.5rem 1.5rem 3rem; }
    }
    @media (min-width: 1024px) {
      .au-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 4rem;
        padding: 2rem;
      }
    }
    @media (min-width: 1280px) { .au-grid { padding-inline: 3rem; } }

    .au-panel { width: 100%; min-width: 0; }
    .au-panel-inner { width: 100%; max-width: 34rem; margin-inline: auto; }

    /* Card */
    .au-card {
      padding: 1.5rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    @media (min-width: 640px) {
      .au-card { padding: 2rem; border-radius: var(--radius-xl); }
    }
    .au-card-head { margin-bottom: 1.5rem; }
    .au-title {
      margin: 0;
      font-size: var(--text-page);
      line-height: 1.25;
    }
    .au-lead {
      margin: 0.5rem 0 0;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      line-height: 1.6;
    }

    /* Form rhythm */
    .au-form { display: grid; gap: 1.25rem; }
    .au-field { min-width: 0; }
    .au-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
    @media (min-width: 640px) { .au-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .au-label { display: block; margin-bottom: 0.375rem; }
    .au-control { position: relative; }
    .au-error {
      margin: 0.375rem 0 0;
      color: var(--color-danger-text);
      font-size: var(--text-sm);
      line-height: 1.35;
    }
    .au-alerts { display: grid; gap: 0.5rem; margin-bottom: 1.25rem; }
    .au-switch {
      margin: 0.25rem 0 0;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      text-align: center;
    }
    .au-switch a {
      display: inline-block;
      padding: 0.5rem 0.25rem;
      color: var(--color-brand);
      font-weight: 600;
      text-decoration: none;
    }
    .au-switch a:hover { color: var(--color-brand-hover); text-decoration: underline; }
    .au-foot-note {
      margin: 1.25rem 0 0;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
      text-align: center;
    }

    /* Showcase */
    .au-showcase { width: 100%; min-width: 0; }
    .au-showcase-inner { max-width: 36rem; margin-inline: auto; }
    @media (min-width: 1024px) { .au-showcase-inner { max-width: none; margin-inline: 0; } }

    .au-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.25rem 0.75rem;
      color: var(--color-success-text);
      background: var(--color-success-soft);
      border: 1px solid var(--color-success-border);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: 600;
    }
    .au-badge-dot {
      width: 0.375rem;
      height: 0.375rem;
      border-radius: var(--radius-full);
      background: var(--color-brand);
    }
    .au-hero {
      max-width: 36rem;
      margin: 0;
      font-size: var(--text-hero);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
    }
    .au-hero em { color: var(--color-brand); font-style: normal; }
    .au-hero-text {
      max-width: 32rem;
      margin: 1rem 0 0;
      color: var(--color-text-secondary);
      font-size: var(--text-base);
      line-height: 1.7;
    }
    @media (min-width: 640px) { .au-hero-text { font-size: var(--text-md); } }

    .au-features {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0.75rem;
      margin: 1.75rem 0 0;
      padding: 0;
      list-style: none;
    }
    @media (min-width: 640px) { .au-features { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .au-feature {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      min-width: 0;
      padding: 1rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition:
        border-color var(--transition-base),
        box-shadow var(--transition-base),
        transform var(--transition-base);
    }
    @media (hover: hover) {
      .au-feature:hover {
        border-color: var(--color-border-strong);
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
    }
    .au-feature-icon {
      display: flex;
      width: 2.5rem;
      height: 2.5rem;
      flex: none;
      align-items: center;
      justify-content: center;
      color: var(--color-brand);
      background: var(--color-brand-light);
      border: 1px solid var(--color-brand-border);
      border-radius: var(--radius-sm);
    }
    .au-feature-icon svg { width: 1.25rem; height: 1.25rem; }
    .au-feature-title {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.4;
    }
    .au-feature-text {
      margin: 0.25rem 0 0;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .au-note {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding: 1rem;
      color: var(--color-success-text);
      background: var(--color-success-soft);
      border: 1px solid var(--color-success-border);
      border-radius: var(--radius-sm);
    }
    .au-note svg { width: 1.25rem; height: 1.25rem; flex: none; margin-top: 0.0625rem; }
    .au-note p { margin: 0; font-size: 0.875rem; line-height: 1.5; }

    /* =========================================================
       Desktop and laptop: the page fits one screen, no page scroll.
       On short screens the secondary copy steps aside first. If the
       screen is still too short, the page scrolls instead of clipping.
       ========================================================= */
    @media (min-width: 1024px) and (max-height: 820px) {
      .au-grid { gap: 3rem; padding-block: 1rem; }
      .au-card { padding: 1.5rem; }
      .au-card-head { margin-bottom: 1rem; }
      .au-form, .au-row { gap: 1rem; }
      .au-alerts { margin-bottom: 1rem; }
      .au-foot-note, .au-note, .au-feature-text { display: none; }
      .au-hero { font-size: clamp(1.75rem, 3.4vw, 2.5rem); }
      .au-hero-text { margin-top: 0.75rem; }
      .au-features { margin-top: 1.25rem; }
      .au-feature { align-items: center; }
    }

    /* =========================================================
       Reduced motion and print
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto !important; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .auth-button:hover, .au-feature:hover { transform: none; }
    }
    @media print {
      .auth-header, .auth-footer, .au-showcase, .skip-link { display: none !important; }
      .au-card { box-shadow: none; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="flex min-h-screen flex-col">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header class="auth-header" role="banner">
    <div class="au-header-inner">
      <a
        href="{% url 'polls:dashboard' %}"
        class="auth-brand"
        aria-label="AgriScan+ dashboard"
      >
        <img
          src="{% static 'polls/img/logo.jpg' %}"
          alt="AgriScan+ logo"
          width="36"
          height="36"
          class="auth-brand-logo"
        />
        <span>AgriScan+</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="au-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="auth-footer">
    <div class="au-footer-inner">
      <p class="auth-footer-text">
        &copy;
        <span id="year"></span>
        <strong>AgriScan+</strong> All rights reserved.
      </p>

      <p class="auth-footer-text">Smart Farming using AI</p>
    </div>
  </footer>

  <!-- Current Year -->
  <script>
    (function () {
      var yearElement = document.getElementById("year");
      if (yearElement) {
        yearElement.textContent = new Date().getFullYear();
      }
    })();
  </script>

  <!-- Shared auth behaviour: password visibility and submit feedback -->
  <script>
    (function () {
      "use strict";

      var EYE_SHOW =
        '<path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" />' +
        '<circle cx="12" cy="12" r="3" />';
      var EYE_HIDE =
        '<path d="M3 3l18 18" />' +
        '<path d="M10.6 5.2A10.7 10.7 0 0 1 12 5c6 0 9.5 7 9.5 7a17.5 17.5 0 0 1-3.1 4.1" />' +
        '<path d="M6.6 6.6C4.1 8.3 2.5 12 2.5 12s3.5 7 9.5 7a9.8 9.8 0 0 0 4.1-.9" />' +
        '<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />';

      /* Password toggles: target comes from data-target, else the sibling input */
      document.querySelectorAll(".password-toggle").forEach(function (button) {
        var targetId = button.getAttribute("data-target");
        var input = targetId
          ? document.getElementById(targetId)
          : button.parentElement && button.parentElement.querySelector("input");
        var icon = button.querySelector("svg");
        if (!input || !icon) return;

        button.addEventListener("click", function () {
          var visible = input.type === "text";
          input.type = visible ? "password" : "text";
          button.setAttribute("aria-label", visible ? "Show password" : "Hide password");
          button.setAttribute("aria-pressed", String(!visible));
          icon.innerHTML = visible ? EYE_SHOW : EYE_HIDE;
        });
      });

      /* Submit feedback: block double submits, show an inline spinner */
      var forms = document.querySelectorAll("form[data-auth-form]");

      function resetForms() {
        forms.forEach(function (form) {
          var submit = form.querySelector('button[type="submit"]');
          if (!submit) return;
          submit.disabled = false;
          submit.classList.remove("is-loading");
          form.removeAttribute("aria-busy");
        });
      }

      forms.forEach(function (form) {
        form.addEventListener("submit", function () {
          var submit = form.querySelector('button[type="submit"]');
          if (!submit) return;
          form.setAttribute("aria-busy", "true");
          submit.classList.add("is-loading");
          /* Disable after the browser has collected the form */
          window.setTimeout(function () { submit.disabled = true; }, 0);
        });
      });

      /* Back/forward cache: never come back to a stuck button */
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) resetForms();
      });
    })();
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
