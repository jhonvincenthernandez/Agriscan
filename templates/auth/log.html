{% load static %}

<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="AgriScan+ — Smart farming platform for rice disease detection, yield prediction, and farm records."
  />

  <meta name="theme-color" content="#15803d" />

  <title>{% block title %}AgriScan+{% endblock %}</title>

  <link
    rel="icon"
    type="image/jpeg"
    href="{% static 'polls/img/logo.jpg' %}"
  />

  <link
    rel="stylesheet"
    href="{% static 'polls/css/tailwind.css' %}"
  />

  <style>
    /* =========================================================
       AgriScan+ Authentication Design System (Aligned with base.html)
       ========================================================= */

    :root {
      --agri-primary: #15803d;
      --agri-primary-hover: #166534;
      --agri-primary-active: #14532d;
      --agri-text: #1f2937;
      --agri-text-muted: #6b7280;
      --agri-border: #e5e7eb;
      --agri-input-border: #d1d5db;
      --agri-focus: rgba(22, 101, 52, 0.22);
      --agri-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      --agri-transition: 180ms ease;
    }

    /* =========================================================
       Global
       ========================================================= */

    html {
      background: #f8fafc;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      color: var(--agri-text);
      background: #f8fafc;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    a,
    button,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--agri-primary);
      outline-offset: 3px;
    }

    /* =========================================================
       Authentication Inputs
       ========================================================= */

    .auth-input {
      display: block;
      width: 100%;
      min-height: 2.875rem;
      margin-top: 0.375rem;
      border: 1px solid var(--agri-input-border);
      border-radius: 0.75rem;
      background-color: #ffffff;
      padding: 0.75rem 0.875rem;
      color: var(--agri-text);
      font-size: 0.875rem;
      line-height: 1.25rem;
      box-shadow: var(--agri-shadow);
      transition:
        border-color var(--agri-transition),
        box-shadow var(--agri-transition),
        background-color var(--agri-transition);
    }

    .auth-input::placeholder {
      color: #9ca3af;
      opacity: 1;
    }

    .auth-input:hover {
      border-color: #9ca3af;
    }

    .auth-input:focus {
      border-color: var(--agri-primary);
      outline: none;
      background-color: #ffffff;
      box-shadow:
        0 0 0 3px var(--agri-focus),
        var(--agri-shadow);
    }

    .auth-input:disabled {
      cursor: not-allowed;
      background-color: #f3f4f6;
      opacity: 0.7;
    }

    .auth-input[aria-invalid="true"] {
      border-color: #dc2626;
    }

    .auth-input[aria-invalid="true"]:focus {
      box-shadow:
        0 0 0 3px rgba(220, 38, 38, 0.16),
        var(--agri-shadow);
    }

    select.auth-input,
    textarea.auth-input {
      appearance: auto;
    }

    /* =========================================================
       Authentication Button
       ========================================================= */

    .auth-button {
      display: inline-flex;
      width: 100%;
      min-height: 2.875rem;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border: 1px solid transparent;
      border-radius: 0.75rem;
      background-color: var(--agri-primary);
      padding: 0.75rem 1.25rem;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.25rem;
      text-align: center;
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.08),
        0 2px 4px rgba(21, 128, 61, 0.08);
      cursor: pointer;
      transition:
        background-color var(--agri-transition),
        box-shadow var(--agri-transition),
        transform var(--agri-transition);
    }

    .auth-button:hover {
      background-color: var(--agri-primary-hover);
      box-shadow:
        0 4px 10px rgba(15, 23, 42, 0.1),
        0 4px 12px rgba(21, 128, 61, 0.14);
      transform: translateY(-1px);
    }

    .auth-button:active {
      transform: translateY(0);
      box-shadow: var(--agri-shadow);
    }

    .auth-button:focus-visible {
      outline: 2px solid var(--agri-primary);
      outline-offset: 3px;
    }

    .auth-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    /* =========================================================
       Authentication Alerts
       ========================================================= */

    .auth-alert {
      display: block;
      border: 1px solid transparent;
      border-radius: 0.75rem;
      padding: 0.75rem 0.875rem;
      font-size: 0.875rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .auth-alert--error {
      border-color: #fecaca;
      background-color: #fef2f2;
      color: #991b1b;
    }

    .auth-alert--info {
      border-color: #bae6fd;
      background-color: #f0f9ff;
      color: #0369a1;
    }

    .auth-alert--success {
      border-color: #bbf7d0;
      background-color: #f0fdf4;
      color: #166534;
    }

    .auth-alert--warning {
      border-color: #fde68a;
      background-color: #fffbeb;
      color: #b45309;
    }

    /* =========================================================
       Password Visibility Button
       ========================================================= */

    .password-toggle {
      touch-action: manipulation;
    }

    .password-toggle svg {
      pointer-events: none;
    }

    /* =========================================================
       Header (Preserved as optimal)
       ========================================================= */

    .auth-header {
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--agri-border);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      border-radius: 0.75rem;
      color: var(--agri-primary);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      transition: opacity var(--agri-transition);
    }

    .auth-brand:hover {
      opacity: 0.85;
    }

    .auth-brand-logo {
      height: 2.25rem;
      width: 2.25rem;
      border-radius: 0.75rem;
      object-fit: cover;
      box-shadow: 0 0 0 1px var(--agri-border);
    }

    /* =========================================================
       Footer
       ========================================================= */

    .auth-footer {
      border-top: 1px solid var(--agri-border);
      background: #ffffff;
    }

    .auth-footer-text {
      color: var(--agri-text-muted);
      font-size: 0.75rem;
      line-height: 1.25rem;
    }

    /* =========================================================
       Responsive Adjustments
       ========================================================= */

    @media (max-width: 640px) {
      .auth-input {
        min-height: 3rem;
        font-size: 1rem;
      }

      .auth-button {
        min-height: 3rem;
        font-size: 0.9375rem;
      }
    }

    /* =========================================================
       Reduced Motion Accessibility
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .auth-button:hover {
        transform: none;
      }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">
  <!-- Header -->
  <header class="auth-header">
    <div
      class="mx-auto flex min-h-[4.5rem] max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8"
    >
      <a
        href="{% url 'polls:dashboard' %}"
        class="auth-brand focus:outline-none"
        aria-label="AgriScan+ dashboard"
      >
        <img
          src="{% static 'polls/img/logo.jpg' %}"
          alt="AgriScan+ logo"
          class="auth-brand-logo"
        />

        <span>
          AgriScan<span class="text-emerald-600">+</span>
        </span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="min-w-0 flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="auth-footer mt-8">
    <div
      class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-4 py-5 text-center sm:flex-row sm:px-6 sm:text-left lg:px-8"
    >
      <p class="auth-footer-text">
        &copy;
        <span id="year"></span>
        <span class="font-medium text-gray-700">AgriScan+</span> All rights reserved.
      </p>

      <p class="auth-footer-text italic">
        Smart Farming using AI
      </p>
    </div>
  </footer>

  <!-- Current Year -->
  <script>
    (function () {
      const yearElement = document.getElementById("year");

      if (yearElement) {
        yearElement.textContent = new Date().getFullYear();
      }
    })();
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
